# Dev override: mounts ../flowback-frontend and ../flowback-backend into the
# containers so code changes are picked up live. Start with ./dev.sh
services:
  flowback-frontend:
    image: node:24-alpine3.22
    build: !reset null
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ../flowback-frontend:/app
      # Keep container-built deps/artifacts separate from the host's
      - frontend_node_modules:/app/node_modules
      - /app/.svelte-kit

  flowback-backend:
    volumes:
      - ../flowback-backend:/app
      - media_data:/app/media

  flowback-celery-worker:
    volumes:
      - ../flowback-backend:/app

  flowback-celery-beat:
    volumes:
      - ../flowback-backend:/app

volumes:
  frontend_node_modules:
